baseURL = "https://slashmantools.us/"
languageCode = "en"
# Global site title. Inherited by any language that doesn't override `title`
# below; each language sets its own localized title. Templates read this via
# `site.Title` for <title>, og:title, and og:site_name — leaving it unset (the
# previous bug: it was nested under [languages.es]) blanks those on every other
# language's homepage.
title = "Intellectual Guides"
enableRobotsTXT = false
# No taxonomy pages — /tags/ and /categories/ would be thin/empty (AdSense-unfriendly).
disableKinds = ["taxonomy", "term"]

[languages]
[languages.zh-tw]
weight = 1
languageName = "中文 (繁體)"
languageCode = "zh-tw"
hrefLang = "zh-TW"
title = "知識指南"
[languages.zh-cn]
weight = 2
languageName = "中文 (简体)"
languageCode = "zh-cn"
hrefLang = "zh-CN"
title = "知识指南"
[languages.en]
weight = 3
languageName = "English"
languageCode = "en"
hrefLang = "en"
title = "Intellectual Guides"
[languages.ja]
weight = 4
languageName = "日本語"
languageCode = "ja"
hrefLang = "ja"
title = "知識ガイド"
[languages.es]
weight = 5
languageName = "Español"
languageCode = "es"
hrefLang = "es"
title = "Guías Intelectuales"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  blog = "/blog/:slug/"

[params]
  description = "Practical, evergreen guides on money, productivity, and the web."
  tagline = "Practical, evergreen guides on money, productivity, and the web."
  author = "slashman413"
  adsenseClient = "ca-pub-7217603696203672"
  gaId = "G-MY95FHB8JG"
  # Lead-capture endpoint. STOP-GAP (2026-08-01): pointed at web3forms
  # (client-side, HTTPS, public). The previous value —
  # http://100.80.243.33:8081/subscribe — was fatal three ways: a Tailscale
  # PRIVATE IP (public visitors can't reach it), HTTP-on-HTTPS mixed content
  # (browsers block it), and a 404 (Mautic 8081 has no /subscribe route), so
  # every subscribe silently failed and list growth was 0. Durable fix (public
  # HTTPS reverse-proxy to a real Mautic form) is in /webhook/RUNBOOK-mautic-ingress.md.
  leadEndpoint = "https://api.web3forms.com/submit"
  # web3forms access key — public by design (it ships in client-side HTML). Same
  # key already used across the slashmantools fleet (e.g. unit-converter).
  # Injected as window.LEAD_ACCESS_KEY; see layouts/partials/head.html.
  leadAccessKey = "32e709fa-d67d-46e9-a1a0-1ac9ef6be251"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
