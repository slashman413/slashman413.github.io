baseURL = "https://slashmantools.us/"
# The site's primary market language is English: EN content lives at the root
# URLs (/blog/<slug>/), other languages under /<lang>/ subdirectories. This must
# be explicit — Hugo defaults to the first [languages] entry by weight (zh-tw),
# which silently put zh-tw at root, emptied the zh-tw sitemap, and forced EN
# into /en/ (duplicate content). See seo-optimization deliverable.
defaultContentLanguage = "en"
languageCode = "en"
# Interpret dates without an explicit offset (e.g. `date: 2026-08-03`) in Taiwan
# time, matching where content is authored. GitHub Actions builds in UTC (8h
# behind); without this, a post dated "today" in Taipei is still "the future" to
# the UTC runner, and Hugo (buildFuture=false by default) silently drops it from
# the rendered site AND sitemap.xml. That's why deploys before 00:00 UTC shipped
# a sitemap missing every same-day post. Asia/Taipei aligns the two clocks.
timeZone = "Asia/Taipei"
# Global site title. Inherited by any language that doesn't override `title`
# below; each language sets its own localized title. Templates read this via
# `site.Title` for <title>, og:title, and og:site_name — leaving it unset (the
# previous bug: it was nested under [languages.es]) blanks those on every other
# language's homepage.
title = "Intellectual Guides"
enableRobotsTXT = false
# Build posts whose `date` is today/future. Hugo defaults buildFuture=false and
# SILENTLY drops future-dated content, so a post dated e.g. 2026-08-03 is excluded
# from any deploy that runs (in UTC) before that date — producing a 404 until the
# next day's build. This bit two posts (complete-ai-tool-stack-2026,
# ai-trends-2026-complete-report) dated 2026-08-03 when the deploy ran on 2026-08-02.
# Setting this true makes same-day/future-dated posts publish immediately.
buildFuture = true
# No taxonomy pages — /tags/ and /categories/ would be thin/empty (AdSense-unfriendly).
disableKinds = ["taxonomy", "term"]

[languages]
[languages.zh-tw]
weight = 1
languageName = "中文 (繁體)"
languageCode = "zh-tw"
hrefLang = "zh-TW"
title = "知識指南"
[languages.zh-cn]
weight = 2
languageName = "中文 (简体)"
languageCode = "zh-cn"
hrefLang = "zh-CN"
title = "知识指南"
[languages.en]
weight = 3
languageName = "English"
languageCode = "en"
hrefLang = "en"
title = "Intellectual Guides"
[languages.ja]
weight = 4
languageName = "日本語"
languageCode = "ja"
hrefLang = "ja"
title = "知識ガイド"
[languages.es]
weight = 5
languageName = "Español"
languageCode = "es"
hrefLang = "es"
title = "Guías Intelectuales"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  blog = "/blog/:slug/"
  # Section is named "topics" because "categories" is a reserved Hugo taxonomy
  # name (its section _index is silently dropped). Permalinks keep the required
  # public URLs at /categories/<slug>/ — the section index itself renders at
  # /topics/ ("All Topics").
  topics = "/categories/:slug/"

[params]
  description = "Practical, evergreen guides on money, productivity, and the web."
  tagline = "Practical, evergreen guides on money, productivity, and the web."
  author = "slashman413"
  # Google Search Console verification. Paste the token from the HTML-tag
  # verification method (the content="..." value of the google-site-verification
  # meta tag GSC gives you). Empty = tag suppressed. See seo-optimized deliverable.
  # Token jV8Xt5l-... is the slashmantools.us domain-property token already used by
  # the sibling tool repos (unit-converter, compound-calculator, etc. — all deploy
  # under https://slashmantools.us/), so it verifies this site too.
  googleSiteVerification = "jV8Xt5l-peRpLknp7xKYpvN8N5tCAkMctq0D-3RVyzk"
  # Twitter/X handle (with @) for twitter:site / twitter:creator card attribution.
  # NOTE: @digitalProductTW is SUSPENDED (per ~/.priv/twitter-api-config.sh notes);
  # the live, API-writable account is @KWC59125740 — point cards at the live one.
  twitterHandle = "@KWC59125740"
  # Canonical newsletter URL — single source of truth for all social CTAs
  # (share-subscribe.html, scripts/newsletter_tweet.py, YouTube/IG descriptions).
  newsletterUrl = "https://slashmantools.us/newsletter/"
  adsenseClient = "ca-pub-7217603696203672"
  gaId = "G-MY95FHB8JG"
  # Lead-capture endpoint. STOP-GAP (2026-08-01): pointed at web3forms
  # (client-side, HTTPS, public). The previous value —
  # http://100.80.243.33:8081/subscribe — was fatal three ways: a Tailscale
  # PRIVATE IP (public visitors can't reach it), HTTP-on-HTTPS mixed content
  # (browsers block it), and a 404 (Mautic 8081 has no /subscribe route), so
  # every subscribe silently failed and list growth was 0. Durable fix (public
  # HTTPS reverse-proxy to a real Mautic form) is in /webhook/RUNBOOK-mautic-ingress.md.
  # leadEndpoint — self-owned Cloudflare Worker (2026-08-03): form → Worker →
  # KV → sync_kv_to_mautic.py cron → Mautic API. Live at api.slashmantools.us
  # (custom domain attached to the lead-capture Worker; leads.* was taken by a
  # pre-existing tunnel CNAME). See /webhook/RUNBOOK-mautic-ingress.md.
  leadEndpoint = "https://api.slashmantools.us/subscribe"
  # web3forms access key no longer needed — the Worker returns {ok:true} and
  # lead-capture.js reads data.ok. Kept empty so window.LEAD_ACCESS_KEY is unset.
  leadAccessKey = ""

