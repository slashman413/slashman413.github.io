name: Deploy Hugo site to Pages

# STAGED: does not take effect until (a) this branch is merged to the Pages
# branch AND (b) repo Settings → Pages → Source is set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.157.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Hugo CLI (extended)
        run: |
          wget -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - name: Build
        run: hugo --gc --minify --baseURL "https://slashmantools.us/"
      - name: Verify build output
        run: |
          test -d public || { echo "::error::public/ was not generated"; exit 1; }
          test -f public/index.html || { echo "::error::public/index.html missing"; exit 1; }
          test -f public/sitemap.xml || { echo "::error::public/sitemap.xml missing"; exit 1; }
          echo "public/ OK — $(find public -name '*.html' | wc -l) HTML pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
