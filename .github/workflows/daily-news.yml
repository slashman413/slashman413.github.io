name: Daily tech-news article

# Generates one reinterpreted tech-news article/day into /news/ (noindex, ad-free,
# not in sitemap until AdSense is approved), then builds + deploys.
# Requires repo secret: DEEPSEEK_API_KEY  (Settings → Secrets and variables → Actions).
# Model: deepseek-v4-flash (override with repo variable/secret DEEPSEEK_MODEL).
on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate today's article
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python scripts/generate_news.py "$(date -u +%F)"

      - name: Commit new article
        run: |
          git config user.name "slashman-news-bot"
          git config user.email "slashman413@gmail.com"
          git add content/news/
          if git diff --staged --quiet; then
            echo "No new article to commit."
          else
            git commit -m "news: auto-published tech-news article $(date -u +%F)"
            # Resilient push: another commit can land on main between our checkout
            # and push (this is what rejected run #16 with "! [rejected] (fetch
            # first)"). Rebase-then-push, retrying to close the TOCTOU window; abort
            # a conflicted rebase instead of silently pushing a broken tree.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt ${attempt}."
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::git push failed after ${attempt} attempts."
                exit 1
              fi
              echo "Push rejected (attempt ${attempt}); rebasing on latest main..."
              git fetch origin main
              git rebase origin/main || { git rebase --abort; echo "::error::rebase conflict on main"; exit 1; }
              sleep $((attempt * 2))
            done
          fi

      - name: Install Hugo
        run: |
          wget -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: hugo --gc --minify --baseURL "https://slashmantools.us/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
