name: Deploy Lead-Capture Webhook

# Deploys the Cloudflare Worker in /webhook/ whenever its source changes.
# One-time setup required (see webhook/README.md):
#   - Add repo secret CLOUDFLARE_API_TOKEN  (Workers Scripts: Edit)
#   - Add repo secret CLOUDFLARE_ACCOUNT_ID
#   - Create the KV namespace and paste its id into webhook/wrangler.toml
#   - Set runtime secrets once via `wrangler secret put` (not in CI)

on:
  push:
    branches: [main, master]
    paths:
      - "webhook/**"
      - ".github/workflows/deploy-webhook.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webhook
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # Skip cleanly (green) until the one-time Cloudflare setup is done, instead
      # of failing every push. Deploy runs automatically once secrets + KV id exist.
      - name: Check deploy prerequisites
        id: check
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare secrets not configured (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) — skipping Worker deploy. See webhook/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q "REPLACE_WITH_KV_NAMESPACE_ID" wrangler.toml; then
            echo "::notice::KV namespace id is still a placeholder in webhook/wrangler.toml — skipping deploy. Run 'npx wrangler kv namespace create LEADS' and paste the id."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
