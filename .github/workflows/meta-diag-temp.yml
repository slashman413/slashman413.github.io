name: Meta Token Diagnostic 2 (temp)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose FB tokens
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          APP_ID: ${{ secrets.META_APP_ID }}
          APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          API="https://graph.facebook.com/v21.0"
          APPTOK=$(curl -s "$API/oauth/access_token?client_id=$APP_ID&client_secret=$APP_SECRET&grant_type=client_credentials" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))')
          echo "--- page public info via app token (name/ID check) ---"
          curl -s -w "\nHTTP:%{http_code}\n" "$API/$FB_PAGE_ID?fields=name,id,is_published,category&access_token=$APPTOK" | head -6
