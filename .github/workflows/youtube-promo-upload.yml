name: Automated YouTube Promo Upload

# Uploads a digital-product promotional Short to the slashman413 YouTube channel daily.
# Produces upload-report.json as a GitHub Actions artifact.
# Requires repo secret: YT_TOKEN_JSON (base64-encoded YouTube OAuth token).

on:
  schedule:
    - cron: "37 10 * * *"   # 10:37 UTC daily (18:37 Taipei)
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Decode YouTube token
        run: |
          echo "$YT_TOKEN_JSON" | base64 -d > /home/runner/slashman413_youtube_token.json
          echo "Token decoded: $(jq .client_id /home/runner/slashman413_youtube_token.json 2>/dev/null | head -c 20)..."
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}

      - name: Run upload
        id: upload
        env:
          YT_TOKEN_PATH: /home/runner/slashman413_youtube_token.json
        run: |
          python3 scripts/upload_promo.py --report upload-report.json
        continue-on-error: true

      - name: Check result
        id: check
        run: |
          if [[ -f upload-report.json ]]; then
            STATUS=$(jq -r '.status // "unknown"' upload-report.json 2>/dev/null)
            echo "Report status: $STATUS"
            jq . upload-report.json
            if [[ "$STATUS" == "success" ]]; then
              echo "UPLOAD_SUCCESS=true" >> $GITHUB_ENV
              echo "VIDEO_ID=$(jq -r '.video_id // "unknown"' upload-report.json)" >> $GITHUB_ENV
            else
              echo "UPLOAD_SUCCESS=false" >> $GITHUB_ENV
            fi
          else
            echo "::error::upload-report.json was not created"
            echo "UPLOAD_SUCCESS=false" >> $GITHUB_ENV
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-report
          path: upload-report.json
          retention-days: 14

      - name: Commit report (if upload succeeded)
        if: env.UPLOAD_SUCCESS == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add upload-report.json
          git commit -m "chore: auto-upload report [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed (may be clean repo)"

      - name: Failure notification
        if: failure()
        run: |
          echo "::error::YouTube upload workflow FAILED — check logs"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"