<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue with Google — Slashman Tools</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h2 { font-size: 20px; margin: 0 0 12px; }
    p { font-size: 14px; color: #94a3b8; margin: 0 0 24px; line-height: 1.5; }
    #gBtnSlot { display: flex; justify-content: center; margin-bottom: 16px; min-height: 44px; }
    .status { font-size: 14px; font-weight: 500; margin-top: 12px; }
    .status.success { color: #10b981; }
    .status.error { color: #f43f5e; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="card">
    <h2>Continue with Google</h2>
    <p>Sign in to confirm your email subscription for AI Workflow Builder & developer updates.</p>
    <div id="gBtnSlot"></div>
    <div id="status" class="status"></div>
  </div>

  <script>
    (function() {
      var CLIENT_ID = "743655601010-slhoc53f98gaaane92lduamfc6835kv5.apps.googleusercontent.com";
      var ENDPOINT = "https://api.slashmantools.us/subscribe/google";
      var statusEl = document.getElementById("status");
      var params = new URLSearchParams(window.location.search);
      var targetOrigin = params.get("target_origin") || "*";

      function onCredential(response) {
        statusEl.className = "status";
        statusEl.textContent = "Verifying account…";

        fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            credential: response.credential,
            source: "google-auth-bridge",
            tags: "google-signin,workflow-builders",
            referrer: document.referrer || window.location.href
          })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.ok) {
            statusEl.className = "status success";
            statusEl.textContent = "✓ Verified! " + (data.email || "");
            if (window.opener) {
              window.opener.postMessage({
                type: "GOOGLE_AUTH_SUCCESS",
                email: data.email || ""
              }, "*");
            }
            setTimeout(function() { window.close(); }, 1200);
          } else {
            throw new Error((data && data.error) || "verification failed");
          }
        })
        .catch(function(err) {
          statusEl.className = "status error";
          statusEl.textContent = "Sign-in error: " + err.message;
        });
      }

      function init() {
        if (!window.google || !window.google.accounts || !window.google.accounts.id) {
          setTimeout(init, 100);
          return;
        }
        window.google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: onCredential,
          ux_mode: "popup",
          context: "signup"
        });
        window.google.accounts.id.renderButton(document.getElementById("gBtnSlot"), {
          type: "standard",
          theme: "filled_blue",
          size: "large",
          shape: "pill",
          text: "continue_with",
          width: 280
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
